<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog - RunDot™</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #1a1f36;
      --navy-light: #2d3250;
      --green: #53b956;
      --green-light: #6fcf72;
      --white: #f8f9fa;
      --font-display: 'Plus Jakarta Sans', sans-serif;
      --font-body: 'DM Sans', sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: var(--font-body); background: var(--white); color: var(--navy); }

    .sub-nav { background: var(--white); padding: 20px 40px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(26,31,54,0.06); position: sticky; top: 0; z-index: 100; backdrop-filter: blur(12px); }
    .sub-nav-logo img { height: 28px; }
    .sub-nav-links { display: flex; gap: 12px; align-items: center; }
    .sub-nav-links a { font-family: var(--font-body); font-size: 14px; color: var(--navy); text-decoration: none; padding: 8px 16px; border-radius: 8px; transition: all 0.2s; }
    .sub-nav-links a:hover { background: rgba(26,31,54,0.04); }
    .sub-nav-links .sub-cta { background: var(--green); color: white; font-weight: 600; }
    .sub-nav-links .sub-cta:hover { background: var(--green-light); }

    .sub-hero { padding: 120px 40px 80px; text-align: center; max-width: 800px; margin: 0 auto; }
    .sub-hero h1 { font-family: var(--font-display); font-size: clamp(36px, 5vw, 56px); font-weight: 800; color: var(--navy); line-height: 1.15; margin-bottom: 24px; }
    .sub-desc { font-size: 18px; line-height: 1.7; color: rgba(26,31,54,0.65); max-width: 600px; margin: 0 auto 48px; }

    .sub-coming-soon { margin: 48px auto 120px; text-align: center; }
    .sub-coming-pill { display: inline-block; padding: 12px 32px; background: rgba(83,185,86,0.08); color: var(--green); font-family: var(--font-display); font-weight: 700; font-size: 14px; letter-spacing: 0.05em; border-radius: 100px; border: 1px solid rgba(83,185,86,0.2); }

    .sub-footer { padding: 48px 40px; text-align: center; border-top: 1px solid rgba(26,31,54,0.06); }
    .sub-footer a { color: var(--navy); text-decoration: none; font-size: 14px; margin: 0 12px; opacity: 0.5; transition: opacity 0.2s; }
    .sub-footer a:hover { opacity: 1; }
    .sub-footer p { font-size: 13px; color: rgba(26,31,54,0.35); margin-top: 16px; }

    @media (max-width: 768px) {
      .sub-nav { padding: 16px 20px; }
      .sub-nav-links a:not(.sub-cta) { display: none; }
      .sub-hero { padding: 80px 24px 48px; }
    }
  </style>
</head>
<body>
<nav class="sub-nav">
  <a href="../" class="sub-nav-logo"><img src="../assets/rundot-logo-dark.svg" alt="RunDot"></a>
  <div class="sub-nav-links">
    <a href="../pricing/">Pricing</a>
    <a href="../resources/">Resources</a>
    <a href="https://rundot.com" target="_blank">Log In</a>
    <a href="https://apps.apple.com/us/app/rundot-adaptive-run-training/id6747775666" class="sub-cta" target="_blank">Get Started</a>
  </div>
</nav>

<section class="sub-hero">
  <h1>Blog</h1>
  <p class="sub-desc">Stories, insights, and lessons from the RunDot community. Training wisdom for runners who want to trust the process.</p>
  <div class="sub-coming-soon">
    <span class="sub-coming-pill">COMING SOON</span>
  </div>
</section>

<footer class="sub-footer">
  <div>
    <a href="#">Privacy</a>
    <a href="#">Terms</a>
    <a href="../contact/">Contact</a>
  </div>
  <p>&copy; 2025 Predictive Fitness. All rights reserved.</p>
</footer>
</body>
</html>
